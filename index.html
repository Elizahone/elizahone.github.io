<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客 | 记录生活与技术</title>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #2563eb;
            --secondary-color: #475569;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --border-color: #e2e8f0;
            --text-dark: #1e293b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* 导航栏样式 */
        .navbar {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--secondary-color);
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 2rem;
        }

        /* 博客文章列表 */
        .blog-list {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .blog-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .blog-card:hover {
            transform: translateY(-5px);
        }

        .blog-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .blog-content {
            padding: 1.5rem;
        }

        .blog-category {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .blog-title {
            font-size: 1.5rem;
            margin-bottom: 0.8rem;
            color: var(--text-dark);
        }

        .blog-meta {
            color: var(--secondary-color);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .blog-desc {
            color: var(--secondary-color);
            margin-bottom: 1.2rem;
        }

        .read-more {
            display: inline-block;
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            transition: gap 0.3s;
        }

        .read-more:hover {
            gap: 0.5rem;
        }

        /* 侧边栏 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .widget {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .widget-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary-color);
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .category-link {
            text-decoration: none;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
        }

        .category-link:hover {
            color: var(--primary-color);
        }

        /* 页脚 */
        .footer {
            background-color: var(--text-dark);
            color: var(--white);
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0;
        }

        .social-link {
            color: white;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .social-link:hover {
            color: var(--primary-color);
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .nav-menu {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo"> <i class="fas fa-feather-alt"></i> 我的博客</a>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link">首页</a></li>
                <li><a href="#" class="nav-link">文章</a></li>
                <li><a href="#" class="nav-link">分类</a></li>
                <li><a href="#" class="nav-link">关于我</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container">
        <!-- 博客文章列表 -->
        <main class="blog-list">
            <article class="blog-card">
                <img src="https://picsum.photos/800/400?random=1" alt="博客封面" class="blog-img">
                <div class="blog-content">
                    <span class="blog-category">技术</span>
                    <h2 class="blog-title">前端开发必备的CSS技巧分享</h2>
                    <div class="blog-meta">
                        <span><i class="fas fa-calendar"></i> 2025-01-01</span>
                        <span><i class="fas fa-user"></i> 博主</span>
                    </div>
                    <p class="blog-desc">分享几个日常开发中非常实用的CSS技巧，让你的页面更简洁、更高效，新手也能快速上手...</p>
                    <a href="#" class="read-more">阅读全文 <i class="fas fa-arrow-right"></i></a>
                </div>
            </article>

            <article class="blog-card">
                <img src="https://picsum.photos/800/400?random=2" alt="博客封面" class="blog-img">
                <div class="blog-content">
                    <span class="blog-category">生活</span>
                    <h2 class="blog">2025年读书计划与成长感悟</h2>
                    <div class="blog-meta">
                        <span><i class="fas fa-calendar"></i> 2025-01-05</span>
                        <span><i class="fas fa-user"></i> 博主</span>
                    </div>
                    <p class="blog-desc">新的一年，制定了读书与学习计划，在文字中寻找力量，在思考中不断成长...</p>
                    <a href="#" class="read-more">阅读全文 <i class="fas fa-arrow-right"></i></a>
                </div>
            </article>
        </main>

        <!-- 侧边栏 -->
        <aside class="sidebar">
            <!-- 分类组件 -->
            <div class="widget">
                <h3 class="widget-title">文章分类</h3>
                <ul class="category-list">
                    <li class="category-item">
                        <a href="#" class="category-link">
                            <span>技术</span>
                            <span>12</span>
                        </a>
                    </li>
                    <li class="category-item">
                        <a href="#" class="category-link">
                            <span>生活</span>
                            <span>8</span>
                        </a>
                    </li>
                    <li class="category-item">
                        <a href="#" class="category-link">
                            <span>随笔</span>
                            <span>5</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- 博主介绍 -->
            <div class="widget">
                <h3 class="widget-title">关于博主</h3>
                <p style="color: var(--secondary-color);">热爱技术、喜欢记录的普通开发者，专注前端开发与个人成长分享。</p>
            </div>
        </aside>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="social-links">
            <a href="#" class="social-link"><i class="fab fa-github"></i></a>
            <a href="#" class="social-link"><i class="fab fa-weixin"></i></a>
            <a href="#" class="social-link"><i class="fab fa-zhihu"></i></a>
        </div>
        <p>&copy; 2025 我的个人博客 | 保留所有权利</p>
    </footer>
</body>
</html>
